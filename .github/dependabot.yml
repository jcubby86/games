version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tanstack:
        patterns:
          - "@tanstack/*"
      socket-io:
        patterns:
          - "socket.io"
          - "socket.io-client"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@eslint-react/*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
      minor-and-patch:
        # Dependabot ranks this group above wildcard-pattern groups, so exclude them explicitly
        exclude-patterns:
          - "@nestjs/*"
          - "@prisma/*"
          - "@tanstack/*"
          - "eslint-*"
          - "@eslint/*"
          - "@eslint-react/*"
          - "@typescript-eslint/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 drops the JS compiler API that typescript-eslint, ts-jest and @nestjs/cli depend on
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/nest"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
